<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stoneric — Quotation Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B2A3F;
    --slate:#5C6B74;
    --clay:#BE7248;
    --clay-dark:#9C5F39;
    --cream:#FBF9F5;
    --white:#FFFFFF;
    --line:#E1DCD2;
    --ink:#22303A;
    --danger:#B84A3E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    letter-spacing:0.01em;
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--navy);
    color:var(--white);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .toolbar .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Barlow Condensed',sans-serif;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.02em;
  }
  .toolbar .brand .tag{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:12px;
    color:#C9D3D8;
    letter-spacing:0;
  }
  .toolbar .actions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{
    border:none;
    border-radius:6px;
    padding:10px 16px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:transform .08s ease, opacity .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--clay);color:var(--white);}
  .btn-primary:hover{background:var(--clay-dark);}
  .btn-ghost{background:transparent;color:var(--white);border:1px solid rgba(255,255,255,0.35);}
  .btn-ghost:hover{border-color:#fff;}
  .btn-small{padding:6px 10px;font-size:13px;border-radius:5px;}
  .btn:disabled{opacity:.55;cursor:default;}

  /* ---------- layout ---------- */
  main{
    display:flex;
    justify-content:center;
    padding:32px 16px 80px;
  }
  .sheet-wrap{width:100%;max-width:820px;}
  .hint{
    font-size:13px;
    color:var(--slate);
    margin:0 2px 14px;
  }
  .sheet{
    background:var(--white);
    border-radius:4px;
    box-shadow:0 1px 3px rgba(11,42,63,0.08), 0 10px 30px rgba(11,42,63,0.06);
    overflow:hidden;
  }

  /* ---------- letterhead ---------- */
  .letterhead{width:100%;display:block;}
  .letterhead img{width:100%;display:block;}

  .sheet-body{padding:28px 36px 36px;}

  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:24px;
    margin-bottom:22px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .client-fields{flex:1;display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;}
  .client-fields label{
    font-size:12px;
    color:var(--slate);
    font-weight:600;
    white-space:nowrap;
  }
  .date-field{text-align:right;min-width:160px;}
  .date-field label{display:block;font-size:12px;color:var(--slate);font-weight:600;margin-bottom:4px;}

  input[type=text], input[type=email], input[type=date], input[type=number], textarea{
    font-family:'Inter',sans-serif;
    color:var(--ink);
    border:none;
    border-bottom:1px dashed #C9C2B4;
    background:transparent;
    padding:4px 2px;
    font-size:14px;
    width:100%;
    outline:none;
  }
  input:focus, textarea:focus{border-bottom:1px solid var(--clay);}
  input::placeholder, textarea::placeholder{color:#B6AFA0;}

  /* ---------- items table ---------- */
  table{width:100%;border-collapse:collapse;margin-bottom:10px;}
  thead th{
    background:var(--navy);
    color:var(--white);
    font-size:11px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-weight:600;
    padding:9px 8px;
    text-align:left;
  }
  thead th.num, tbody td.num{text-align:right;}
  thead th.center{text-align:center;}
  tbody td{
    padding:7px 8px;
    border-bottom:1px solid var(--line);
    font-size:14px;
    vertical-align:middle;
  }
  tbody tr:nth-child(even){background:#FAF8F4;}
  td.item-no{width:36px;color:var(--slate);text-align:center;font-variant-numeric:tabular-nums;}
  td.qty{width:70px;}
  td.price{width:120px;}
  td.total{width:130px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  td.row-actions{width:34px;text-align:center;}
  input.qty-input, input.price-input{text-align:right;}
  .remove-row{
    background:none;border:none;color:var(--slate);cursor:pointer;
    font-size:16px;line-height:1;padding:2px 6px;border-radius:4px;
  }
  .remove-row:hover{color:var(--danger);background:#F6E9E7;}

  .add-row-btn{
    margin:6px 0 22px;
    background:none;
    border:1px dashed #C9C2B4;
    color:var(--slate);
    padding:8px 12px;
    font-size:13px;
    font-weight:600;
    border-radius:5px;
    cursor:pointer;
  }
  .add-row-btn:hover{border-color:var(--clay);color:var(--clay-dark);}

  /* ---------- totals ---------- */
  .totals{
    display:flex;
    justify-content:flex-end;
    margin-bottom:26px;
  }
  .totals-box{width:260px;}
  .totals-line{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    padding:6px 0;
  }
  .totals-line.sub{color:var(--slate);border-bottom:1px solid var(--line);}
  .totals-line.vat{color:var(--slate);border-bottom:1px solid var(--line);}
  .totals-line.grand{
    font-weight:700;
    font-size:16px;
    color:var(--navy);
    padding-top:10px;
  }
  .totals-line span:last-child{font-variant-numeric:tabular-nums;}

  /* ---------- terms & signature ---------- */
  .terms{margin-bottom:34px;}
  .terms label{
    display:block;
    font-size:12px;
    color:var(--slate);
    font-weight:600;
    margin-bottom:6px;
  }
  textarea#terms{
    width:100%;
    min-height:90px;
    resize:vertical;
    line-height:1.5;
    border:1px solid var(--line);
    border-radius:4px;
    padding:10px;
  }
  textarea#terms:focus{border-color:var(--clay);}

  .signature{margin-top:10px;}
  .signature .name{font-weight:700;font-size:15px;}
  .signature .title{font-size:13px;color:var(--slate);}

  /* ---------- print mode (used only while generating the PDF) ---------- */
  .sheet.printing input, .sheet.printing textarea{
    border:none !important;
    pointer-events:none;
  }
  .sheet.printing .row-actions,
  .sheet.printing .add-row-btn{display:none !important;}
  .sheet.printing input::placeholder, .sheet.printing textarea::placeholder{color:transparent;}

  @media (max-width:600px){
    .sheet-body{padding:20px 16px 28px;}
    .meta-row{flex-direction:column;}
    .date-field{text-align:left;}
    thead th, tbody td{font-size:12px;padding:6px 5px;}
    td.qty{width:50px;}
    td.price{width:90px;}
    .toolbar{padding:12px 14px;}
  }

  .status-msg{
    text-align:center;
    font-size:13px;
    color:var(--slate);
    margin-top:10px;
    min-height:16px;
  }
</style>
</head>

        <div class="sheet-body">

          <div class="meta-row">
            <div class="client-fields">
              <label>Company Name:</label>
              <input type="text" id="clientName" placeholder="Client's company name">
              <label>Address:</label>
              <input type="text" id="clientAddress" placeholder="Client's address">
              <label>Attention to:</label>
              <input type="text" id="clientAttn" placeholder="Contact person">
              <label>Email:</label>
              <input type="email" id="clientEmail" placeholder="client@email.com">
            </div>
            <div class="date-field">
              <label>Date:</label>
              <input type="date" id="quoteDate">
            </div>
          </div>

          <table>
            <thead>
              <tr>
                <th style="width:36px;">No.</th>
                <th>Description</th>
                <th class="center" style="width:70px;">Qty</th>
                <th class="num" style="width:120px;">Unit Price</th>
                <th class="num" style="width:130px;">Total</th>
                <th style="width:34px;"></th>
              </tr>
            </thead>
            <tbody id="itemsBody"></tbody>
          </table>

          <button class="add-row-btn" id="addRowBtn">+ Add item</button>

          <div class="totals">
            <div class="totals-box">
              <div class="totals-line sub"><span>Sub Total</span><span id="subTotal">₱0.00</span></div>
              <div class="totals-line vat"><span>VAT 12%</span><span id="vatTotal">₱0.00</span></div>
              <div class="totals-line grand"><span>Grand Total</span><span id="grandTotal">₱0.00</span></div>
            </div>
          </div>

          <div class="terms">
            <label>Terms &amp; Conditions</label>
            <textarea id="terms">1. This quotation is valid for 30 days from the date above.
2. 50% down payment is required before work commences.
3. Prices are subject to change without prior notice after validity period.</textarea>
          </div>

          <div class="signature">
            <div class="name">Eric F. Abadilla</div>
            <div class="title">Contractor</div>
          </div>

        </div>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>
  </main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  const itemsBody = document.getElementById('itemsBody');
  const addRowBtn = document.getElementById('addRowBtn');
  const resetBtn = document.getElementById('resetBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const statusMsg = document.getElementById('statusMsg');
  const sheet = document.getElementById('sheet');

  const peso = (n) => '₱' + (isNaN(n) ? 0 : n).toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});

  function renumberRows(){
    [...itemsBody.querySelectorAll('tr')].forEach((tr, i) => {
      tr.querySelector('.item-no').textContent = i + 1;
    });
  }

  function addRow(desc, qty, price){
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="item-no">1</td>
      <td><input type="text" class="desc-input" placeholder="Item description" value="${desc || ''}"></td>
      <td class="qty"><input type="number" class="qty-input" min="0" step="1" value="${qty ?? ''}"></td>
      <td class="price"><input type="number" class="price-input" min="0" step="0.01" value="${price ?? ''}"></td>
      <td class="total"><span class="row-total">₱0.00</span></td>
      <td class="row-actions"><button class="remove-row" title="Remove item">✕</button></td>
    `;
    itemsBody.appendChild(tr);
    renumberRows();
    recalc();
  }

  function recalc(){
    let subTotal = 0;
    itemsBody.querySelectorAll('tr').forEach(tr => {
      const qty = parseFloat(tr.querySelector('.qty-input').value) || 0;
      const price = parseFloat(tr.querySelector('.price-input').value) || 0;
      const total = qty * price;
      tr.querySelector('.row-total').textContent = (qty && price) ? peso(total) : '';
      subTotal += total;
    });
    const vat = subTotal * 0.12;
    const grand = subTotal + vat;
    document.getElementById('subTotal').textContent = peso(subTotal);
    document.getElementById('vatTotal').textContent = peso(vat);
    document.getElementById('grandTotal').textContent = peso(grand);
  }

  itemsBody.addEventListener('input', recalc);
  itemsBody.addEventListener('click', (e) => {
    if (e.target.classList.contains('remove-row')){
      e.target.closest('tr').remove();
      renumberRows();
      recalc();
    }
  });

  addRowBtn.addEventListener('click', () => addRow());

  function todayISO(){
    const d = new Date();
    return d.toISOString().slice(0,10);
  }

  function resetForm(){
    document.getElementById('clientName').value = '';
    document.getElementById('clientAddress').value = '';
    document.getElementById('clientAttn').value = '';
    document.getElementById('clientEmail').value = '';
    document.getElementById('quoteDate').value = todayISO();
    document.getElementById('terms').value = `1. This quotation is valid for 30 days from the date above.
2. 50% down payment is required before work commences.
3. Prices are subject to change without prior notice after validity period.`;
    itemsBody.innerHTML = '';
    addRow();
    addRow();
    statusMsg.textContent = '';
  }

  resetBtn.addEventListener('click', () => {
    if (confirm('Start a new quotation? This clears everything currently on the form.')) resetForm();
  });

  // ---------- PDF export ----------
  async function downloadPdf(){
    downloadBtn.disabled = true;
    statusMsg.textContent = 'Preparing your PDF…';

    sheet.classList.add('printing');

    try{
      const canvas = await html2canvas(sheet, {
        scale: 2,
        backgroundColor: '#ffffff',
        useCORS: true
      });

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();

      const imgWidth = pageWidth;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;

      let heightLeft = imgHeight;
      let position = 0;
      const imgData = canvas.toDataURL('image/jpeg', 0.95);

      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;

      while (heightLeft > 0){
        position = heightLeft - imgHeight;
        pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
      }

      const clientName = document.getElementById('clientName').value.trim() || 'Untitled';
      const date = document.getElementById('quoteDate').value || todayISO();
      const safeName = clientName.replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '');
      pdf.save(`Quotation-${safeName}-${date}.pdf`);

      statusMsg.textContent = 'PDF downloaded.';
    }catch(err){
      console.error(err);
      statusMsg.textContent = 'Something went wrong generating the PDF. Please try again.';
    }finally{
      sheet.classList.remove('printing');
      downloadBtn.disabled = false;
      setTimeout(() => { statusMsg.textContent = ''; }, 4000);
    }
  }

  downloadBtn.addEventListener('click', downloadPdf);

  // ---------- init ----------
  document.getElementById('quoteDate').value = todayISO();
  addRow();
  addRow();
})();
</script>
</body>
